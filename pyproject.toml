[project]
name = "mba-ia-pull-evaluation-prompt"
version = "0.1.0"
description = "Otimização e avaliação de prompts com LangChain e LangSmith"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.3.1",
    "langchain-classic>=1.0.7",
    "langchain-google-genai>=4.2.2",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.2.1",
    "langsmith>=0.4.0",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.0",
    "pyyaml>=6.0.2",
    "transformers>=5.14.1",
]

[project.optional-dependencies]
hugging-face-local = [
    "accelerate>=1.10.0",
    "torch>=2.8.0",
    "transformers>=4.55.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
